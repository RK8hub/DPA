[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-pipeline"
version = "0.1.0"
description = "Pipeline local de terminal para preparar contexto, tomar decisiones y generar componentes de UI revisables a partir de exportaciones de diseño."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Design Pipeline contributors" }]
keywords = ["design", "pipeline", "components", "codegen", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
design-pipeline = "design_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
design_pipeline = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
